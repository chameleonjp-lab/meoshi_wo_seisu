name: Validate and publish game Pages
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name == 'push' && 'production' || format('pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    if: github.repository == 'chameleonjp-lab/meoshi_wo_seisu'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate and stage only approved runtime files
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          site="$(mktemp -d "$RUNNER_TEMP/game-pages.XXXXXX")"
          for file in index.html social-card-v1.jpg; do
            test -f "$file" && test -s "$file" && test ! -L "$file"
            install -m 0644 -- "$file" "$site/$file"
            cmp -- "$file" "$site/$file"
          done
          test "$(find "$site" -type f | wc -l)" -eq 2
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re, subprocess
          class Card(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.fields = {}
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == 'meta' and (name := a.get('property') or a.get('name')):
                      self.fields.setdefault(name, []).append(a.get('content'))
                  if tag == 'link' and a.get('rel') == 'canonical':
                      self.fields.setdefault('canonical', []).append(a.get('href'))
          root = 'https://chameleonjp-lab.github.io/meoshi_wo_seisu/'
          text = Path('index.html').read_text(encoding='utf-8')
          card = Card()
          card.feed(text)
          for field, target in {'canonical': root, 'og:url': root, 'og:image': root+'social-card-v1.jpg',
                                'twitter:image': root+'social-card-v1.jpg', 'twitter:card': 'summary_large_image',
                                'og:image:width': '1200', 'og:image:height': '630'}.items():
              assert card.fields.get(field) == [target], field
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S | re.I)
          assert scripts
          for script in scripts:
              subprocess.run(['node', '--check'], input=script.encode('utf-8'), check=True)
          jpg = Path('social-card-v1.jpg').read_bytes()
          assert jpg.startswith(b'\xff\xd8') and jpg.endswith(b'\xff\xd9')
          pos = 2
          while pos < len(jpg):
              assert jpg[pos] == 255
              while jpg[pos] == 255:
                  pos += 1
              marker = jpg[pos]
              pos += 1
              size = int.from_bytes(jpg[pos:pos+2], 'big')
              assert size >= 2 and pos+size <= len(jpg)
              if marker in (0xc0, 0xc1, 0xc2):
                  dims = tuple(int.from_bytes(jpg[pos+i:pos+i+2], 'big') for i in (5, 3))
                  assert dims == (1200, 630), dims
                  break
              pos += size
          else:
              raise AssertionError('JPEG dimensions not found')
          PY
          printf 'path=%s\n' "$site" >> "$GITHUB_OUTPUT"
      - name: Upload only the verified Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ${{ steps.stage.outputs.path }}
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'chameleonjp-lab/meoshi_wo_seisu'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse a stale deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current" = "$EXPECTED_SHA"
      - name: Deploy only the artifact verified from this commit
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
